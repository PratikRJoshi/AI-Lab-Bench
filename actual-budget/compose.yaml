services:
  actual:
    image: ${ACTUAL_IMAGE:-actualbudget/actual-server@sha256:06cf186569cf58d93e12659ff1a517b65b5b0ebee7050a3991d4bd8a1d398da6}
    container_name: ${ACTUAL_CONTAINER:-actual-budget}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ACTUAL_PORT:-5006}:5006"
    volumes:
      - type: bind
        source: ${ACTUAL_DATA_DIR:?Set ACTUAL_DATA_DIR to the restored data folder}
        target: /data
